[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cursignal"
version = "0.1.0"
description = "Signal completion with an enlarged cursor and fading messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
]

[project.scripts]
cursignal = "cursignal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

